<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunrise General Store — Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1118;--card:#171b26;--c2:#1f2432;--bd:#2a3042;--tx:#e8ebf3;--mu:#8b95aa;--pr:#4f8cff;--ac:#f5a524;--ok:#34d399;--er:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

button,input,select{font:inherit;color:inherit}
input,select{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
button{cursor:pointer;border:0;background:var(--c2);border-radius:10px;padding:9px 14px;font-weight:600}
button:hover{filter:brightness(1.15)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.br0{font-size:16px;flex:1}.hr{display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;background:var(--c2);padding:4px;border-radius:12px}
nav a{padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600}nav a.on{background:var(--pr);color:#fff}
.pill{background:var(--c2);border-radius:99px;padding:4px 12px;font-size:12px;text-transform:capitalize;color:var(--mu)}
.gh{background:transparent;border:1px solid var(--bd)}
main{padding:20px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
h3{margin:0 0 12px;font-size:16px}.mu,small{color:var(--mu)}
.bill{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.sb input{border:0;background:none;font-size:15px;padding:11px 0}.sb input:focus{outline:0}.sb:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px #4f8cff33}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;font-weight:400;transition:.15s}
.pc:hover{border-color:var(--pr);transform:translateY(-2px)}.pc:disabled{opacity:.4}
.pc b{font-size:14px}.pc span{color:var(--ac);font-weight:700;font-size:16px;margin-top:4px}.pc em{font-style:normal;font-size:12px;color:var(--ok)}.pc em.lo,.lo td:nth-child(6){color:var(--er)}
aside{position:sticky;top:76px}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ln small{display:block}
.qb{display:flex;align-items:center;gap:8px}.qb button{padding:2px 10px}
.row{display:flex;gap:8px;margin:6px 0 12px}label{font-size:12px;color:var(--mu);font-weight:600}
.t{display:flex;justify-content:space-between;padding:3px 0}.tot{font-size:22px;font-weight:700;color:var(--ac);border-top:1px solid var(--bd);margin-top:8px;padding-top:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px}.seg button.on{background:var(--pr);color:#fff}
.cta{width:100%;background:var(--ac);color:#111;padding:13px;font-size:15px;margin-top:6px}
.err{color:var(--er);font-size:12px;margin:4px 0}
.hero{min-height:80vh;display:grid;place-content:center;text-align:center;gap:24px;padding:20px}.hero h1{margin:0;font-size:32px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px}.role{cursor:pointer;transition:.15s;max-width:300px}.role:hover{border-color:var(--pr);transform:translateY(-3px)}.role .i{font-size:36px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}tr.lo{background:#f8717114}tbody tr[onclick]{cursor:pointer}tbody tr:hover{background:var(--c2)}
.tw{overflow-x:auto}.bar{display:flex;gap:10px;margin-bottom:16px}.bar input{max-width:340px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.kpis b{display:block;font-size:22px;margin:4px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.hb{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hb i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--pr),#7aa9ff)}.hb b{text-align:right}
.dn{width:130px;height:130px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle 38px,transparent 98%,#000 100%);mask:radial-gradient(circle 38px,transparent 98%,#000 100%)}
.ov{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:16px;overflow:auto}.ov[hidden]{display:none}
.modal{background:var(--card);border-radius:16px;padding:22px;width:min(460px,100%)}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg div:first-child,.fg .w{grid-column:1/-1}
.paper{background:#fff;color:#111;width:min(560px,100%);border-radius:10px;padding:28px;font-size:13px}.paper h2{margin:0;text-align:center;color:#1b4b8a}.paper p{text-align:center;margin:2px 0;color:#555}.paper table td,.paper table th{border-color:#ddd;color:#111;padding:6px}
.paper .r{text-align:right}

.bl{--ink:#14181f;--soft:#6b7380;--line:#e3e6eb;--acc:#0b6b4f;--tint:#eef6f2;background:#fff;color:var(--ink);width:min(794px,100%);border-radius:6px;padding:40px 44px 28px;font-size:13px;line-height:1.5;position:relative;overflow:hidden}
.bl *{box-sizing:border-box}
.bl::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--acc)}
.bl h2,.bl p{margin:0;text-align:left;color:inherit}
.bl small{color:var(--soft);font-size:11px}
.bl-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding-top:6px}
.bl-shop h2{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.bl-shop p{color:var(--soft);font-size:12px;margin-top:2px}
.bl-doc{text-align:right}
.bl-doc .t{font-size:34px;font-weight:300;letter-spacing:.16em;color:var(--acc);line-height:1}
.bl-doc .n{font-size:15px;font-weight:700;margin-top:10px}
.bl-doc .d{color:var(--soft);font-size:12px}
.bl-chip{display:inline-block;margin-top:8px;padding:3px 12px;border:1.5px solid var(--acc);color:var(--acc);border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.12em}
.bl-meta{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bl-meta div{padding:12px 0 12px 14px;border-left:1px solid var(--line)}.bl-meta div:first-child{border-left:0;padding-left:0}
.bl-meta small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:600}.bl-meta b{display:block;font-size:13.5px;margin-top:2px}.bl-meta i{display:block;font-style:normal;color:var(--soft);font-size:11px}
.bl table{width:100%;border-collapse:collapse}
.bl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);padding:0 8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.bl td{padding:10px 8px;border-bottom:1px solid var(--line);color:var(--ink);white-space:normal;vertical-align:top}
.bl th:first-child,.bl td:first-child{padding-left:0;width:28px;color:var(--soft)}.bl th:last-child,.bl td:last-child{padding-right:0}
.bl .r{text-align:right}.bl td.r,.bl th.r{white-space:nowrap}
.bl td b{font-weight:600}.bl td small{display:block;margin-top:1px}
.bl-mid{display:grid;grid-template-columns:1fr 280px;gap:32px;margin-top:22px;align-items:start}
.bl-box{background:var(--tint);border-radius:10px;padding:14px 16px}
.bl-box.pay{display:flex;gap:14px;align-items:center}.bl-box .qr img{display:block;width:92px;height:92px;image-rendering:pixelated}
.bl-box b{display:block;font-size:13px}.bl-box small{display:block;line-height:1.4}
.bl-words{margin-top:14px}.bl-words small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:600}.bl-words p{font-weight:600;font-size:12.5px;margin-top:2px}
.bl-tot div{display:flex;justify-content:space-between;gap:16px;padding:5px 0;color:var(--soft)}.bl-tot div span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.bl-tot .g{margin-top:8px;padding:14px 16px;border-radius:10px;background:var(--acc);color:#fff;align-items:baseline}
.bl-tot .g span{color:#fff!important}.bl-tot .g span:first-child{font-size:11px;letter-spacing:.14em;font-weight:600}.bl-tot .g span:last-child{font-size:24px;font-weight:700}
.bl-gst{margin-top:24px}.bl-gst small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:600;margin-bottom:6px}
.bl-gst th{border-bottom:1px solid var(--line);padding-bottom:5px}.bl-gst td{padding:6px 8px;font-size:12px}.bl-gst td:first-child,.bl-gst th:first-child{width:auto;color:var(--ink)}
.bl-ft{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.bl-ft p{color:var(--soft);font-size:11px;line-height:1.5;max-width:380px}.bl-ft .ty{color:var(--ink);font-weight:600;font-size:13px;margin-bottom:3px}
.bl-sig{text-align:center;min-width:170px}.bl-sig div{height:44px;border-bottom:1px solid var(--ink)}.bl-sig small{display:block;margin-top:4px}
@media print{.bl td{padding:7px 8px}.bl-meta{margin:18px 0 16px}.bl-mid{margin-top:16px}.bl-gst{margin-top:16px}.bl-ft{margin-top:22px}}
@media(max-width:620px){.bl{padding:28px 18px 20px}.bl-top,.bl-mid{display:block}.bl-doc{text-align:left;margin-top:16px}.bl-meta{grid-template-columns:1fr}.bl-meta div{border-left:0;padding-left:0!important;border-top:1px solid var(--line)}.bl-mid>*{margin-bottom:16px}.bl-ft{display:block}.bl-sig{margin-top:20px}}
@media print{@page{size:A4 portrait;margin:0}html,body{background:#fff!important}.ov{display:block!important;overflow:visible!important}.bl{width:210mm!important;max-width:none;border-radius:0;padding:14mm 15mm 8mm;break-inside:avoid;page-break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}.qr{display:grid;place-items:center;margin-top:14px;gap:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c2);border:1px solid var(--bd);padding:11px 18px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:.2s}#toast.on{opacity:1}#toast.er{color:var(--er)}#toast.ok{color:var(--ok)}
@media(max-width:900px){.bill{grid-template-columns:1fr}aside{position:static}}
@media print{html,body{height:auto;margin:0}body>*:not(#ov){display:none!important}body::before{display:none}.ov{position:static;background:none;padding:0}.no-print{display:none!important}}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;

const KEY='sbs_v1';
let STORE;
function loadStore(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.inv)return j}catch(e){}return{inv:SEED.inv,sales:[],ctr:0}}
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(STORE))}catch(e){toast('Could not save (browser storage blocked)','er')}}
STORE=loadStore();
function localApi(u,b){
 STORE=loadStore();
 if(u=='/api/state')return{inv:STORE.inv,sales:STORE.sales,cats:SEED.cats};
 if(u=='/api/checkout'){
  if(!b.items.length)throw Error('Cart is empty');
  const items=b.items.map(i=>{const p=STORE.inv.find(p=>p.c==i.c);if(!p)throw Error('Unknown product '+i.c);return{...p,q:i.q}});
  const bad=items.filter(p=>p.q>p.s).map(p=>'Only '+p.s+' in stock for '+p.n);if(bad.length)throw Error(bad.join('; '));
  const k=calc();if(k.err)throw Error(k.err);
  let det='',up=b.pm=='UPI'?k.tot:0;
  if(b.pm=='Split'){const[[m1,a1],[m2,a2]]=b.split;if(a1<0||a2<0)throw Error('Split amounts cannot be negative');if(Math.abs(a1+a2-k.tot)>.01)throw Error('Split amounts must add up to '+k.tot.toFixed(2));det=m1+': Rs.'+a1.toFixed(2)+' + '+m2+': Rs.'+a2.toFixed(2);up=(m1=='UPI'?a1:0)+(m2=='UPI'?a2:0)}
  items.forEach(p=>{STORE.inv.find(x=>x.c==p.c).s-=p.q});
  STORE.ctr=(STORE.ctr||STORE.sales.length)+1;
  const lab={none:'No discount',flat:'Flat amount',pct:'Percentage',bogo:'BOGO (Buy 1 Get 1)',coupon:'Coupon '+(b.cv||'').trim().toUpperCase()}[b.dt];
  const sale={no:'INV-'+String(STORE.ctr).padStart(4,'0'),t:Date.now(),L:k.L.map(x=>({c:x.c,n:x.n,q:x.q,p:x.p,t:x.t,l:x.l})),sub:k.sub,dn:lab,d:k.d,tax:k.tax,tb:k.tb,tot:k.tot,pm:b.pm,det,up};
  STORE.sales.push(sale);saveStore();return sale}
 if(u=='/api/product'){
  const f={n:b.n,k:b.k,p:+b.p,t:+b.t,s:+b.s,r:+b.r,u:b.u};
  if(b.c){Object.assign(STORE.inv.find(p=>p.c==b.c),f);saveStore();return{c:b.c}}
  const n=Math.max(0,...STORE.inv.map(p=>+p.c.slice(3)||0))+1,c='GRC'+String(n).padStart(3,'0');
  STORE.inv.push({c,...f});saveStore();return{c}}

const api=(u,b)=>new Promise((res,rej)=>{try{res(JSON.parse(JSON.stringify(localApi(u,b))))}catch(e){rej(e)}});

function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
const csv=r=>r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
function expSales(){dl('sales.csv',csv([['Invoice','Date','Items','Discount','Payment','Subtotal','Discount Amt','Tax','Total']].concat(DB.sales.map(s=>[s.no,new Date(s.t).toLocaleString('en-IN'),s.L.map(b=>b.c+' x'+b.q).join('; '),s.dn,s.pm,s.sub,s.d,s.tax,s.tot]))))}
function expInv(){dl('inventory.csv',csv([['Code','Name','Category','Price','Tax %','Stock','Reorder','Supplier']].concat(DB.inv.map(p=>[p.c,p.n,p.k,p.p,p.t,p.s,p.r,p.u]))))}
function resetAll(){if(confirm('Erase ALL sales and restore the original inventory?')){try{localStorage.removeItem(KEY)}catch(e){}STORE=loadStore();cart=[];load().then(shell)}}
load().then(shell);
</script></body></html>
